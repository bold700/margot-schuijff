<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Bedankt voor je bericht — Margot Schuijff</title>
    <meta name="description" content="Bedankt voor je bericht. Margot Schuijff neemt zo snel mogelijk contact met je op." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Elms+Sans:wght@100..900&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" type="image/png" href="./media/logo.png" />
    <link rel="canonical" href="https://www.schuijffrecruitmentenadvies.nl/bedankt" />
    <meta name="robots" content="noindex,follow" />

    <link rel="stylesheet" href="./styles.css?v=76" />

    <style>
      .thanks {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--paper);
        color: var(--ink);
        padding: clamp(48px, 10vw, 96px) clamp(20px, 7vw, 96px);
        text-align: center;
      }
      .thanks__inner { max-width: 620px; }
      .thanks__kicker {
        font-family: var(--font-sans);
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--accent, #a8453a);
        margin: 0 0 24px;
      }
      .thanks__title {
        font-family: var(--font-serif);
        font-weight: 300;
        font-size: clamp(2.2rem, 6vw, 4rem);
        line-height: 1.06;
        letter-spacing: -0.022em;
        margin: 0 0 28px;
        text-wrap: balance;
      }
      .thanks__body {
        font-family: var(--font-sans);
        font-size: clamp(1rem, 2.2vw, 1.15rem);
        line-height: 1.65;
        color: var(--ink-soft);
        margin: 0 0 40px;
      }
      .thanks__actions {
        display: flex;
        gap: 16px;
        justify-content: center;
        flex-wrap: wrap;
      }
    </style>
  </head>
  <body class="page-detail">
    <main class="thanks">
      <div class="thanks__inner">
        <p class="thanks__kicker">Bericht ontvangen</p>
        <h1 class="thanks__title">Dank je wel — ik kom snel bij je terug.</h1>
        <p class="thanks__body">
          Ik bekijk je bericht persoonlijk en neem doorgaans binnen één werkdag contact met je op.
          Wil je iets toevoegen of heb je haast? Stuur dan gerust een mail naar
          <a href="mailto:margotschuijff@gmail.com">margotschuijff@gmail.com</a>.
        </p>
        <div class="thanks__actions">
          <a class="btn btn--primary btn--lg" href="./">
            <span>Terug naar home</span>
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M3 8h10M9 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </a>
          <a class="btn btn--ghost btn--lg" href="./werkwijze">
            <span>Lees mijn werkwijze</span>
          </a>
        </div>
      </div>
    </main>

    <script src="./analytics.js?v=1" defer></script>
  </body>
</html>
